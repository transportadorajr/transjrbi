name: Publish

on:
  push:
    branches: [ production ]

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "version=$(script/next_version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/transjrbi:${{ steps.version.outputs.version }}
            ${{ vars.DOCKERHUB_USERNAME }}/transjrbi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the Excel export image
        uses: docker/build-push-action@v7
        with:
          context: xlsx_export
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/transjrbi-xlsx:${{ steps.version.outputs.version }}
            ${{ vars.DOCKERHUB_USERNAME }}/transjrbi-xlsx:latest
          cache-from: type=gha,scope=xlsx
          cache-to: type=gha,mode=max,scope=xlsx

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi

  deploy:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/compose.yaml,deploy/release
          target: ${{ secrets.VPS_APP_PATH }}
          strip_components: 1
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_VERSION: ${{ needs.publish.outputs.version }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_VERSION,APP_PATH
          command_timeout: 20m
          script: |
            set -e
            cd "$APP_PATH"
            bash release
