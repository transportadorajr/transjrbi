name: Claude AGENTS.md review

on:
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '@claude revis') || contains(github.event.comment.body, '@claude review')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Resolve the PR branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "head_ref=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)" >> "$GITHUB_OUTPUT"

      - name: Checkout the PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 1

      - name: Review the PR against AGENTS.md
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            /agents-md-review ${{ env.PR_NUMBER }} --review-only

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            This review runs in GitHub Actions, so posting it on the PR is already authorized:
            do not wait for approval and do not edit any file.
            - Post every verified finding as an inline comment on the line it refers to, with
              mcp__github_inline_comment__create_inline_comment, quoting the AGENTS.md rule.
            - Post the report from step 7 of the skill as a single PR comment with
              `gh pr comment ${{ env.PR_NUMBER }} --body-file <file>`.
            - Write every comment in Portuguese.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob,Write"
