name: Claude AGENTS.md review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review the PR against AGENTS.md
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            /agents-md-review ${{ github.event.pull_request.number }} --review-only

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This review runs in GitHub Actions, so posting it on the PR is already authorized:
            do not wait for approval and do not edit any file.
            - Post every verified finding as an inline comment on the line it refers to, with
              mcp__github_inline_comment__create_inline_comment, quoting the AGENTS.md rule.
            - Post the report from step 7 of the skill as a single PR comment with
              `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`.
            - Write every comment in Portuguese.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob,Write"
