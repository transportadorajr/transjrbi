services:
  web:
    image: transjr/transjrbi:${APP_VERSION:-latest}
    env_file: .env
    environment:
      RAILS_ENV: production
      DB_HOST: db
      XLSX_EXPORT_URL: http://xlsx:4000
    volumes:
      - ./storage:/rails/storage
    depends_on: [db]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 120s
      start_interval: 2s
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`app.${APP_DOMAIN:?APP_DOMAIN must be set in .env}`) || Host(`admin.${APP_DOMAIN}`)"
      traefik.http.routers.web.entrypoints: websecure
      traefik.http.routers.web.tls.certresolver: letsencrypt
      traefik.http.services.web.loadbalancer.server.port: "3000"
      traefik.http.services.web.loadbalancer.sticky.cookie.name: transjrbi_server
      traefik.http.services.web.loadbalancer.sticky.cookie.secure: "true"
      traefik.http.services.web.loadbalancer.sticky.cookie.httponly: "true"
      traefik.http.services.web.loadbalancer.healthcheck.path: /up
      traefik.http.services.web.loadbalancer.healthcheck.interval: 2s
      traefik.http.services.web.loadbalancer.healthcheck.timeout: 2s

  jobs:
    image: transjr/transjrbi:${APP_VERSION:-latest}
    env_file: .env
    environment:
      RAILS_ENV: production
      DB_HOST: db
      XLSX_EXPORT_URL: http://xlsx:4000
    command: bundle exec good_job start
    volumes:
      - ./storage:/rails/storage
    depends_on: [db]
    restart: unless-stopped
    stop_grace_period: 30s

  xlsx:
    image: transjr/transjrbi-xlsx:${APP_VERSION:-latest}
    environment:
      XLSX_EXPORT_TOKEN: ${XLSX_EXPORT_TOKEN:?XLSX_EXPORT_TOKEN must be set in .env}
      XLSX_EXPORT_MAX_CONCURRENCY: "2"
    restart: unless-stopped
    stop_grace_period: 30s

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: transjrbi
      POSTGRES_PASSWORD: ${TRANSJRBI_DATABASE_PASSWORD}
      POSTGRES_DB: transjrbi_production
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped

  traefik:
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL must be set in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --ping=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  letsencrypt:
