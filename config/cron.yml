shared:
  atua_expired_files:
    cron: '30 3 * * * America/Sao_Paulo'
    class: 'Atua::PurgeExpiredFilesJob'
  admin_http_requests:
    cron: '45 3 * * * America/Sao_Paulo'
    class: 'Admin::PurgeHttpRequestsJob'
    description: 'Deletes the recorded HTTP requests older than 30 days'
  atua_movements:
    cron: '0 7-23 * * 1-6 America/Sao_Paulo'
    class: 'Atua::ScheduleMovementsJob'
    description: 'Imports the current day of movements of every enabled tenant, hourly from 7h to 23h, Monday to Saturday'
  atua_movements_business_hours:
    cron: '30 8-17 * * 1-6 America/Sao_Paulo'
    class: 'Atua::ScheduleMovementsJob'
    description: 'Adds the half-hour imports of the current day of movements from 8h30 to 17h30, Monday to Saturday'
  atua_movements_late_night:
    cron: '0 0-1 * * 0,2-6 America/Sao_Paulo'
    class: 'Atua::ScheduleMovementsJob'
    description: 'Imports the current day of movements at 0h and 1h, closing the nights from Monday to Saturday'
  atua_previous_day:
    cron: '30 0 * * * America/Sao_Paulo'
    class: 'Atua::SchedulePreviousDayJob'
    description: 'Imports the previous day of transport documents, manifests and expenses of every enabled tenant'
  atua_registries:
    cron: '30 5 * * * America/Sao_Paulo'
    class: 'Atua::ScheduleRegistriesJob'
    description: 'Imports the customers and vehicles of every enabled tenant'
  atua_month_closing:
    cron: '0 4 3 * * America/Sao_Paulo'
    class: 'Atua::ScheduleMonthClosingJob'
    description: 'Imports again the whole previous month of movements of every enabled tenant'
